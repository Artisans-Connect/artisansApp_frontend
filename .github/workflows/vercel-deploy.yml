name: Deploy Flutter Web PWA to Vercel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env file from Secrets
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "SUPABASE_OAUTH_REDIRECT_URL=${{ secrets.SUPABASE_OAUTH_REDIRECT_URL || 'https://artisans-app-frontend.vercel.app/' }}" >> .env
          echo "SUPABASE_PASSWORD_RESET_REDIRECT_URL=${{ secrets.SUPABASE_PASSWORD_RESET_REDIRECT_URL || 'https://craft-match-verification-portal.vercel.app/update-password' }}" >> .env
          echo "EXPRESS_API_BASE_URL=${{ secrets.EXPRESS_API_BASE_URL }}" >> .env
          echo "VERIFICATION_PORTAL_URL=${{ secrets.VERIFICATION_PORTAL_URL }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" >> .env

      - name: Install dependencies
        run: flutter pub get



      - name: Build Web App
        run: flutter build web --release

      - name: Prepare build files
        run: |
          # Copy vercel.json into the build output directory
          cp vercel.json build/web/vercel.json

      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_ZdI3IgX5eEyiD6AUMP1KUwIy
          VERCEL_PROJECT_ID: prj_AJrImonIDjsaLlJnBUDL5rV3z1ja
        run: |
          # Install Vercel CLI
          npm install -g vercel
          
          # Deploy build/web folder directly as production
          cd build/web
          vercel --prod --token ${{ secrets.VERCEL_TOKEN }} --yes

