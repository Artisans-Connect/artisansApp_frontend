name: Build & Publish Android Release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      release_notes:
        description: 'Release notes / Changelog'
        required: false
        default: 'CraftMatch Android Release'
      release_type:
        description: 'Build Type (release or debug)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version_step
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="1.0.0"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Create .env Configuration
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}" >> .env
          echo "SUPABASE_OAUTH_REDIRECT_URL=${{ secrets.SUPABASE_OAUTH_REDIRECT_URL || 'https://artisans-app-frontend.vercel.app/' }}" >> .env
          echo "SUPABASE_PASSWORD_RESET_REDIRECT_URL=${{ secrets.SUPABASE_PASSWORD_RESET_REDIRECT_URL || 'https://craft-match-verification-portal.vercel.app/update-password' }}" >> .env
          echo "EXPRESS_API_BASE_URL=${{ secrets.EXPRESS_API_BASE_URL || 'https://artisansapp-backend.onrender.com/api' }}" >> .env
          echo "VERIFICATION_PORTAL_URL=${{ secrets.VERIFICATION_PORTAL_URL || 'https://craft-match-verification-portal.vercel.app/' }}" >> .env
          echo "GOOGLE_MAPS_API_KEY=${{ secrets.GOOGLE_MAPS_API_KEY }}" >> .env
          echo "MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}" >> .env
          echo "FIREBASE_VAPID_KEY=${{ secrets.FIREBASE_VAPID_KEY }}" >> .env

      - name: Create google-services.json for Firebase
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON }}" > android/app/google-services.json
            echo "Created android/app/google-services.json from repository secret."
          else
            cat << 'EOF' > android/app/google-services.json
{
  "project_info": {
    "project_number": "35491862087",
    "project_id": "artisansconnect-498304",
    "storage_bucket": "artisansconnect-498304.firebasestorage.app"
  },
  "client": [
    {
      "client_info": {
        "mobilesdk_app_id": "1:35491862087:android:94e1ebab25501624e44362",
        "android_client_info": {
          "package_name": "com.example.artisans_app"
        }
      },
      "oauth_client": [
        {
          "client_id": "35491862087-v8st1cmcd1ulv8t0mv2762osp981s47m.apps.googleusercontent.com",
          "client_type": 3
        }
      ],
      "api_key": [
        {
          "current_key": "AIzaSyD24ueVE0-P_fFi6h4HybcpgG928YWUq24"
        }
      ],
      "services": {
        "appinvite_service": {
          "other_platform_oauth_client": [
            {
              "client_id": "35491862087-v8st1cmcd1ulv8t0mv2762osp981s47m.apps.googleusercontent.com",
              "client_type": 3
            }
          ]
        }
      }
    }
  ],
  "configuration_version": "1"
}
EOF
            echo "Created fallback android/app/google-services.json for GitHub runner."
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.release_type || 'release' }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --build-name=${{ steps.version_step.outputs.VERSION }}
            APK_PATH="build/app/outputs/flutter-apk/app-debug.apk"
          else
            flutter build apk --release --build-name=${{ steps.version_step.outputs.VERSION }}
            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          fi
          echo "APK_SRC=$APK_PATH" >> $GITHUB_ENV

      - name: Package & Compute Checksum
        id: metadata
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          mkdir -p dist
          VERSIONED_APK="dist/CraftMatch-v${VERSION}.apk"
          LATEST_APK="dist/CraftMatch-latest.apk"
          
          cp "$APK_SRC" "$VERSIONED_APK"
          cp "$APK_SRC" "$LATEST_APK"
          
          FILE_SIZE_BYTES=$(stat -c%s "$VERSIONED_APK")
          FILE_SIZE_MB=$(awk "BEGIN {printf \"%.1f\", $FILE_SIZE_BYTES/1048576}")
          SHA256_HASH=$(sha256sum "$VERSIONED_APK" | awk '{print $1}')
          
          echo "FILE_SIZE_BYTES=$FILE_SIZE_BYTES" >> $GITHUB_OUTPUT
          echo "FILE_SIZE_MB=${FILE_SIZE_MB} MB" >> $GITHUB_OUTPUT
          echo "SHA256=$SHA256_HASH" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload APKs to Supabase Cloud Storage
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://qdeznjpvkhrxesjykovi.supabase.co' }}"
          SUPABASE_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          
          if [ -z "$SUPABASE_KEY" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY secret not found in repo secrets. Falling back to SUPABASE_PUBLISHABLE_KEY."
            SUPABASE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"
          fi
          
          echo "Uploading CraftMatch-latest.apk to Supabase Storage ($SUPABASE_URL)..."
          HTTP_STATUS_LATEST=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SUPABASE_URL}/storage/v1/object/app-releases/CraftMatch-latest.apk" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@dist/CraftMatch-latest.apk")
          echo "CraftMatch-latest.apk upload completed with status HTTP $HTTP_STATUS_LATEST"
          
          echo "Uploading CraftMatch-v${VERSION}.apk to Supabase Storage..."
          HTTP_STATUS_VERSION=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${SUPABASE_URL}/storage/v1/object/app-releases/CraftMatch-v${VERSION}.apk" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            -H "x-upsert: true" \
            --data-binary "@dist/CraftMatch-v${VERSION}.apk")
          echo "CraftMatch-v${VERSION}.apk upload completed with status HTTP $HTTP_STATUS_VERSION"
          
          if [ "$HTTP_STATUS_LATEST" -ne 200 ] && [ "$HTTP_STATUS_LATEST" -ne 201 ]; then
            echo "::warning::Direct upload returned status $HTTP_STATUS_LATEST. Check bucket permissions and secret key."
          fi

      - name: Publish to GitHub Releases (Archive Backup)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v${{ steps.version_step.outputs.VERSION }}"
          name: "CraftMatch Mobile v${{ steps.version_step.outputs.VERSION }}"
          body: |
            ## CraftMatch Android Release v${{ steps.version_step.outputs.VERSION }}
            
            ${{ github.event.inputs.release_notes || 'Official CraftMatch Android mobile build.' }}
            
            ### Package Details:
            - **Filename:** `CraftMatch-v${{ steps.version_step.outputs.VERSION }}.apk`
            - **Size:** ${{ steps.metadata.outputs.FILE_SIZE_MB }} (${{ steps.metadata.outputs.FILE_SIZE_BYTES }} bytes)
            - **SHA-256 Checksum:** `${{ steps.metadata.outputs.SHA256 }}`
            - **Min Requirement:** Android 8.0 (API level 26) or newer
            - **Public CDN Download:** https://qdeznjpvkhrxesjykovi.supabase.co/storage/v1/object/public/app-releases/CraftMatch-latest.apk
          files: |
            dist/CraftMatch-v${{ steps.version_step.outputs.VERSION }}.apk
            dist/CraftMatch-latest.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Backend Webhook (Sync Release Manifest)
        if: success()
        run: |
          VERSION="${{ steps.version_step.outputs.VERSION }}"
          SUPABASE_URL="${{ secrets.SUPABASE_URL || 'https://qdeznjpvkhrxesjykovi.supabase.co' }}"
          LATEST_URL="${SUPABASE_URL}/storage/v1/object/public/app-releases/CraftMatch-latest.apk"
          DOWNLOAD_URL="${SUPABASE_URL}/storage/v1/object/public/app-releases/CraftMatch-v${VERSION}.apk"
          BACKEND_URL="${{ secrets.EXPRESS_API_BASE_URL || 'https://artisansapp-backend.onrender.com/api' }}"
          WEBHOOK_KEY="${{ secrets.VERIFICATION_ADMIN_KEY }}"
          
          echo "Notifying backend at $BACKEND_URL/releases/webhook..."
          
          curl -s -X POST "$BACKEND_URL/releases/webhook" \
            -H "Content-Type: application/json" \
            -H "x-verification-admin-key: $WEBHOOK_KEY" \
            -d "{
              \"appName\": \"CraftMatch\",
              \"latestVersion\": \"$VERSION\",
              \"fileSize\": \"${{ steps.metadata.outputs.FILE_SIZE_MB }}\",
              \"fileSizeBytes\": ${{ steps.metadata.outputs.FILE_SIZE_BYTES || 0 }},
              \"sha256\": \"${{ steps.metadata.outputs.SHA256 }}\",
              \"downloadUrl\": \"$LATEST_URL\",
              \"versionedDownloadUrl\": \"$DOWNLOAD_URL\",
              \"notes\": \"${{ github.event.inputs.release_notes || 'Automated cloud build release' }}\"
            }" || echo "Webhook call completed or backend was temporarily unreachable"
